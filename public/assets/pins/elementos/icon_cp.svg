<svg xmlns="http://www.w3.org/2000/svg" viewBox="320 50 560 1225" fill="none" role="img" aria-labelledby="control-title control-desc">
  <title id="control-title">Punto de control</title>
  <desc id="control-desc">Baliza blanca y naranja en perspectiva, con división diagonal, tirantes superiores y estaca vertical. Las zonas blancas son opacas; el exterior y los espacios entre tirantes son transparentes.</desc>
