  </g>
  <g id="mandos" fill="#707B83" stroke="#101010" stroke-width="12" stroke-linejoin="round">
    <path id="mando-izquierdo" d="M454 690V638C454 615 539 615 539 638V690Z"/>
    <rect id="base-mando-izquierdo" x="448" y="689" width="97" height="28" rx="9"/>
