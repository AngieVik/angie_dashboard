<svg xmlns="http://www.w3.org/2000/svg" viewBox="235 70 525 1380" fill="none" role="img" aria-labelledby="comunicaciones-title comunicaciones-desc">
  <title id="comunicaciones-title">Comunicaciones</title>
  <desc id="comunicaciones-desc">Radio portátil gris con antena larga, dos mandos superiores, pulsador lateral, pantalla blanca y cuatro ranuras de altavoz. La pantalla es opaca y el exterior es transparente.</desc>
