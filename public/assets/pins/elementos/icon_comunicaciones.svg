    <rect id="base-mando-derecho" x="591" y="689" width="92" height="28" rx="9"/>
  </g>
  <rect id="pulsador-lateral" x="257" y="844" width="42" height="151" rx="21" fill="#707B83" stroke="#101010" stroke-width="12"/>
  <path id="lateral" fill="#707B83" stroke="#101010" stroke-width="13" stroke-linejoin="round" d="M641 712H686C715 712 740 733 740 760V1375C740 1405 718 1430 688 1430H641Z"/>
  <path id="carcasa" fill="#707B83" stroke="#101010" stroke-width="13" stroke-linejoin="round" d="M336 712H650C679 712 699 735 699 764V1376C699 1405 679 1430 650 1430H336C308 1430 285 1405 285 1376V763C285 735 308 712 336 712Z"/>
  <rect id="pantalla" x="344" y="792" width="306" height="115" rx="1" fill="#FFFFFF" stroke="#101010" stroke-width="12"/>
  <g id="rejilla-altavoz" fill="#101010">
