<svg xmlns="http://www.w3.org/2000/svg" viewBox="280 170 1230 655" fill="none" role="img" aria-labelledby="carpa-title carpa-desc">
  <title id="carpa-title">Carpa sanitaria</title>
  <desc id="carpa-desc">Carpa sanitaria amarilla con techo a dos aguas, estructura negra, paño frontal cerrado y acceso con lona enrollada. En el interior se ven la lona del fondo, su costura vertical y el borde inferior en perspectiva. Fondo y suelo del acceso transparentes.</desc>

