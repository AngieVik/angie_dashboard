  <title id="equipo-title">Equipo sanitario</title>
  <desc id="equipo-desc">Mochila roja de intervención sin cruz, con dos cintas negras, hebilla sencilla y bolsillo frontal con cremallera. El exterior, el hueco del asa y los espacios entre los tirantes son transparentes.</desc>
