<svg xmlns="http://www.w3.org/2000/svg" viewBox="350 30 850 970" fill="none" role="img" aria-labelledby="salida-title salida-desc">
  <title id="salida-title">Bandera de salida</title>
  <desc id="salida-desc">Bandera verde ondulada con dos trazos negros de pliegue y mástil inclinado con remate circular. El mástil es blanco opaco y el exterior es transparente.</desc>
