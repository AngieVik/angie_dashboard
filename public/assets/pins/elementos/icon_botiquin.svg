  <title id="botiquin-title">Botiquín</title>
  <desc id="botiquin-desc">Maletín sanitario rojo con asa integrada, cierre sencillo y cruz blanca. El exterior y el hueco del asa son transparentes; la cruz es opaca.</desc>
